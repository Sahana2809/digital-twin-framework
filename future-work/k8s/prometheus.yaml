apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: digital-twin
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
    scrape_configs:
      - job_name: 'traffic_generator'
        static_configs:
          - targets: ['traffic-generator:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: digital-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: aiops-scaler
      containers:
        - name: prometheus
          image: prom/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: digital-twin
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
